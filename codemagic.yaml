workflows:
  ios-workflow:
    name: iOS Workflow
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - voicevox
      ios_signing:
        distribution_type: app_store
        bundle_identifier: moe.nae.sorokun
      vars:
        BUNDLE_ID: moe.nae.sorokun
        APP_STORE_APPLE_ID: 6798420420
    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Download VOICEVOX assets
        script: |
          curl -sSfL https://github.com/VOICEVOX/voicevox_core/releases/download/0.16.4/download-osx-arm64 -o download
          chmod +x download
          export GITHUB_TOKEN="$GH_TOKEN"
          yes y | ./download --exclude c-api onnxruntime additional-libraries --models-pattern s0.vvm -o assets
          echo "--- assets/dict and assets/models contents ---"
          find assets/dict assets/models -maxdepth 2

      - name: Download VOICEVOX iOS frameworks
        script: |
          curl -L -o voicevox_core.zip "$VOICEVOX_CORE_IOS_URL"
          unzip -o voicevox_core.zip -d ios/Frameworks/
          curl -L -o voicevox_onnxruntime.zip "$VOICEVOX_ONNXRUNTIME_IOS_URL"
          unzip -o voicevox_onnxruntime.zip -d ios/Frameworks/

      - name: Clean stale Pods state and install
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Flutter build ipa
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
