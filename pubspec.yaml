# Fork: https://github.com/Vultaire/sorokun
name: soroban_app
description: "Trainer for soroban."
publish_to: 'none'
version: 1.0.25

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animations: ^2.0.11
  decimal: ^3.2.6
  rational: 
  flutter_soloud: ^4.1.6
  carousel_slider: ^5.1.1
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  custom_sliding_segmented_control: ^1.8.5
  url_launcher: ^6.3.2
  stroke_text: ^1.0.0
  flex_color_scheme: ^8.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/MPLUSRounded1c-Medium.ttf
    - assets/abacus5.ttf
    - assets/abacus5spaced.ttf
    - assets/correct.png
    - assets/correct.wav
    - assets/delete.wav
    - assets/fail.wav
    - assets/hare.png
    - assets/icon.png
    - assets/incorrect.png
    - assets/incorrect.wav
    - assets/invalid.wav
    - assets/kake.png
    - assets/kakean.png
    - assets/kanryou.png
    - assets/key-tap.wav
    - assets/mitori.png
    - assets/mitorian.png
    - assets/ogutamafontS2.ttf
    - assets/pass.wav
    - assets/passthreshold.wav
    - assets/progress.wav
    - assets/sine-beep.wav
    - assets/soroban-grey-tr.png
    - assets/soroban-grey.png
    - assets/sorokun_color.png
    - assets/sorokun_white.png
    - assets/starting-sine.wav
    - assets/tick.wav
    - assets/tortoise.png
    - assets/wari.png
    - assets/warian.png
    - assets/yame.png
  fonts:
    - family: abacusFont
      fonts:
        - asset: assets/abacus5.ttf
    - family: abacusFontSpaced
      fonts:
        - asset: assets/abacus5spaced.ttf
    - family: mPlus
      fonts:
        - asset: assets/MPLUSRounded1c-Medium.ttf
    - family: ogutama
      fonts:
        - asset: assets/ogutamafontS2.ttf
  config:
    enable-swift-package-manager: false

flutter_launcher_icons:
  image_path: "assets/icon.png"
  ios: true
  android: false
  remove_alpha_ios: true
