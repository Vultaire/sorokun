name: soroban_app
description: "Trainer for soroban."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  decimal: ^2.3.3
  rational: 
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new: ^3.2.0
  audioplayers: ^6.5.1
  carousel_slider: ^5.1.1
  material_symbols_icons: ^4.2874.0
  go_router: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/complexityThresholdMap.json
    - assets/open_jtalk_dic_utf_8-1.11/
  fonts:
    - family: abacusFont
      fonts:
        - asset: assets/abacus5.ttf
    - family: abacusFontSpaced
      fonts:
        - asset: assets/abacus5spaced.ttf
    - family: bizUDPGR
      fonts:
        - asset: assets/BIZUDPGothic-Regular.ttf
    - family: bizUDGB
      fonts:
        - asset: assets/BIZUDGothic-Bold.ttf
