name: soroban_app
description: "Trainer for soroban."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  decimal: ^3.2.6
  rational: 
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  flutter_soloud: ^4.1.6
  carousel_slider: ^5.1.1
  material_symbols_icons: ^4.2874.0
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  hooks: ^2.0.2
  code_assets: ^1.0.0
  ffigen: ^21.0.0
  async: ^2.11.0
  intl: ^0.20.2
  custom_sliding_segmented_control: ^1.8.5
  url_launcher: ^6.3.2
  stroke_text: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/dict/open_jtalk_dic_utf_8-1.11/
    - assets/models/vvms/
    - assets/character_icon/
    - assets/negaimasiteha/
    - assets/include/
    - assets/
  fonts:
    - family: abacusFont
      fonts:
        - asset: assets/abacus5.ttf
    - family: abacusFontSpaced
      fonts:
        - asset: assets/abacus5spaced.ttf
    - family: mPlus
      fonts:
        - asset: assets/MPLUSRounded1c-Medium.ttf
    - family: ogutama
      fonts:
        - asset: assets/ogutamafontS2.ttf
