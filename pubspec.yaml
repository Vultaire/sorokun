name: soroban_app
description: "Trainer for soroban."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  provider: ^6.1.5
  decimal: ^3.2.6
  rational: 
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  flutter_soloud:
    git:
      url: https://github.com/alnitak/flutter_soloud.git
      ref: dev
  carousel_slider: ^5.1.1
  material_symbols_icons: ^4.2874.0
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  hooks: ^2.0.2
  code_assets: ^1.0.0
  ffigen: ^21.0.0
  async: ^2.11.0
  device_preview: ^1.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/voicevox/dict/open_jtalk_dic_utf_8-1.11/
    - assets/voicevox/models/vvms/
    - assets/correct.png
    - assets/incorrect.png
    - assets/yame.png
    - assets/timesup.png
    - assets/kanryou.png
    - assets/finished.png
    - assets/soroban-grey.png
    - assets/mitori.png
    - assets/mitorian.png
    - assets/kake.png
    - assets/kakean.png
    - assets/wari.png
    - assets/warian.png
    - assets/tick.wav
    - assets/passthreshold.wav
    - assets/pass.wav
    - assets/fail.wav
    - assets/key-tap.wav
    - assets/correct.wav
    - assets/incorrect.wav
    - assets/progress.wav
    - assets/delete.wav
    - assets/invalid.wav
    - assets/starting-sine.wav
    - assets/sine-beep.wav
    - assets/finished.wav
    - assets/character_icon/
    - assets/negaimasiteha/
    - assets/
  fonts:
    - family: abacusFont
      fonts:
        - asset: assets/abacus5.ttf
    - family: abacusFontSpaced
      fonts:
        - asset: assets/abacus5spaced.ttf
    - family: bizUDPGR
      fonts:
        - asset: assets/BIZUDPGothic-Regular.ttf
    - family: bizUDGB
      fonts:
        - asset: assets/BIZUDGothic-Bold.ttf
    - family: robotoMono
      fonts:
        - asset: assets/RobotoMono-VariableFont_wght.ttf
    - family: ogutama
      fonts:
        - asset: assets/ogutamafontS2.ttf
