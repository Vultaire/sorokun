name: soroban_app
description: "Trainer for soroban."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  provider: ^6.1.5
  decimal: ^2.3.3
  rational: 
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  flutter_soloud: ^3.4.9
  ffmpeg_kit_flutter_new: ^3.2.0
  audioplayers: ^6.5.1
  carousel_slider: ^5.1.1
  material_symbols_icons: ^4.2874.0
  go_router: ^17.0.1
  vector_graphics: ^1.1.19
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  ffigen: ^11.0.0
  integration_test:
    sdk: flutter
  vector_graphics_compiler: ^1.1.20

flutter:
  uses-material-design: true
  assets:
    - assets/complexityThresholdMap.json
    - assets/open_jtalk_dic_utf_8-1.11/
    - assets/correct.png
    - assets/incorrect.png
    - assets/yame.png
    - assets/timesup.png
    - assets/kanryou.png
    - assets/finished.png
    - assets/tick.wav
    - assets/passthreshold.wav
    - assets/pass.wav
    - assets/fail.wav
    - assets/key-tap.wav
    - assets/correct.wav
    - assets/incorrect.wav
    - assets/progress.wav
    - assets/delete.wav
    - assets/invalid.wav
    - assets/starting-sine.wav
    - assets/sine-beep.wav
    - assets/finished.wav
    - path: assets/svg/
      transformers:
        - package: vector_graphics_compiler
  fonts:
    - family: abacusFont
      fonts:
        - asset: assets/abacus5.ttf
    - family: abacusFontSpaced
      fonts:
        - asset: assets/abacus5spaced.ttf
    - family: bizUDPGR
      fonts:
        - asset: assets/BIZUDPGothic-Regular.ttf
    - family: bizUDGB
      fonts:
        - asset: assets/BIZUDGothic-Bold.ttf
    - family: robotoMono
      fonts:
        - asset: assets/RobotoMono-VariableFont_wght.ttf
