<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sorokun: soroban and mental-arithmetic practice.">
  <meta name="theme-color" content="#ffffff">

  <style>
    html {
      color-scheme: light dark;
      --sorokun-page-background: Canvas;
      background-color: var(--sorokun-page-background);
    }

    html[data-sorokun-theme="light"] {
      color-scheme: light;
    }

    html[data-sorokun-theme="dark"] {
      color-scheme: dark;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background-color: var(--sorokun-page-background, Canvas);
    }
  </style>

  <script>
    (() => {
      const root = document.documentElement;
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const updateThemeColor = () => {
        if (themeColor) {
          themeColor.content = getComputedStyle(root).backgroundColor;
        }
      };

      let savedTheme = 'system';
      try {
        const storedTheme = localStorage.getItem('flutter.theme_mode');
        if (storedTheme !== null) {
          savedTheme = JSON.parse(storedTheme);
        }
      } catch (_) {
        // Keep the system color scheme if browser storage is unavailable.
      }
      if (savedTheme === 'light' || savedTheme === 'dark') {
        root.dataset.sorokunTheme = savedTheme;
      }

      window.sorokunSetDocumentTheme = (brightness, backgroundColor) => {
        root.dataset.sorokunTheme = brightness;
        root.style.setProperty('--sorokun-page-background', backgroundColor);
        updateThemeColor();
      };

      const systemScheme = matchMedia('(prefers-color-scheme: dark)');
      const updateSystemThemeColor = () => {
        if (!root.dataset.sorokunTheme) {
          updateThemeColor();
        }
      };
      if (systemScheme.addEventListener) {
        systemScheme.addEventListener('change', updateSystemThemeColor);
      } else {
        systemScheme.addListener(updateSystemThemeColor);
      }
      updateThemeColor();
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sorokun">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sorokun!</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
